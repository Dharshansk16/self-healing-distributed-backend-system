apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: self-healing-system
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    scrape_configs:
      - job_name: "api-gateway"
        metrics_path: "/metrics"
        static_configs:
          - targets: ["api-gateway.self-healing-system.svc.cluster.local:8000"]
      - job_name: "auth-service"
        metrics_path: "/metrics"
        static_configs:
          - targets: ["auth-service.self-healing-system.svc.cluster.local:8001"]
      - job_name: "order-service"
        metrics_path: "/metrics"
        static_configs:
          - targets: ["order-service.self-healing-system.svc.cluster.local:8002"]
      - job_name: "payment-service"
        metrics_path: "/metrics"
        static_configs:
          - targets: ["payment-service.self-healing-system.svc.cluster.local:8003"]
      - job_name: "inventory-service"
        metrics_path: "/metrics"
        static_configs:
          - targets: ["inventory-service.self-healing-system.svc.cluster.local:8004"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: self-healing-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.retention.time=1h"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config-volume
              mountPath: /etc/prometheus
      volumes:
        - name: config-volume
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: self-healing-system
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
