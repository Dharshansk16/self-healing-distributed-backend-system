          env:
            - name: PORT
              value: "8000"
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:8001"
            - name: ORDER_SERVICE_URL
              value: "http://order-service:8002"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: self-healing-system
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - port: 8000
      targetPort: 8000

