services:
  inventory-service:
    build: ./services/inventory-service
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/api/v1/health')\""]
      interval: 5s
      timeout: 3s
      retries: 5

  payment-service:
    build: ./services/payment-service
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/api/v1/health')\""]
      interval: 5s
      timeout: 3s
      retries: 5

  order-service:
    build: ./services/order-service
    ports:
      - "8000:8000"
    environment:
      INVENTORY_SERVICE_URL: http://inventory-service:8001
      PAYMENT_SERVICE_URL: http://payment-service:8002
      FAILURE_SIMULATION_ENABLED: "false"
    depends_on:
      inventory-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 5s
      timeout: 3s
      retries: 5
